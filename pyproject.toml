[project]
name = "local-intelligence"
version = "0.1.0a1"
description = "Abliteration + LoRA fine-tuning harness for open models on Apple Silicon (8/16/32GB+)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
keywords = ["mlx", "apple-silicon", "abliteration", "lora", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx>=0.29",
    "mlx-lm>=0.32,<0.33",  # li serve patches mlx_lm.server internals
    "huggingface_hub>=0.34",
    "safetensors>=0.5",
    "numpy>=1.26",
    "datasets>=3.0",
    "tomli-w>=1.0",
    "optuna>=4.0",
]

[project.urls]
Repository = "https://github.com/comraderoyce/local-intelligence"
Issues = "https://github.com/comraderoyce/local-intelligence/issues"

[project.scripts]
li = "li.cli:main"

[build-system]
requires = ["uv_build>=0.7,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "li"

[dependency-groups]
dev = ["pytest>=8"]
